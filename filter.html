<!DOCTYPE html>
<html lang="uk">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Підбір подій і квитків — Eventify</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <header class="site-header">
            <div class="header-container">
                <a href="index.html" class="logo">🎉 Eventify</a>
                <nav class="nav-links">
                    <a href="filter.html" class="active">Підбір квитків</a>
                    <a href="artists.html">Артисти</a>
                    <a href="venues.html">Майданчики</a>
                    <a href="about.html">Про нас</a>
                    <span id="auth-nav" style="display: inline-flex; gap: 15px; margin-left: 10px;"></span>
                </nav>
            </div>
        </header>

        <main class="main-container">
            <section class="hero-section">
                <h1>Підбір подій та квитків</h1>
                <p>Налаштуй параметри пошуку, щоб знайти події, які підходять саме тобі</p>
            </section>

            <section class="filter-card">
                <form id="event-filter-form" class="filter-grid">
                    <div class="form-group">
                        <label for="filter-title">Назва події</label>
                        <input type="text" id="filter-title" name="title" placeholder="Наприклад, Концерт">
                    </div>

                    <div class="form-group">
                        <label for="filter-city">Місто</label>
                        <input type="text" id="filter-city" name="city" placeholder="Наприклад, Київ або Kyiv">
                    </div>

                    <div class="form-group">
                        <label for="filter-min-price">Ціна від (грн)</label>
                        <input type="number" id="filter-min-price" name="min_price" min="0" max="99999" step="0.01" placeholder="0">
                    </div>

                    <div class="form-group">
                        <label for="filter-max-price">Ціна до (грн)</label>
                        <input type="number" id="filter-max-price" name="max_price" min="0" max="99999" step="0.01" placeholder="2000">
                    </div>

                    <div class="form-group">
                        <label for="filter-date-from">Дата та час від</label>
                        <input type="datetime-local" id="filter-date-from" name="date_from">
                    </div>

                    <div class="form-group">
                        <label for="filter-date-to">Дата та час до</label>
                        <input type="datetime-local" id="filter-date-to" name="date_to">
                    </div>

                    <div class="form-group">
                        <label for="filter-artist">Артист</label>
                        <select id="filter-artist" name="artist">
                            <option value="">Усі артисти</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="filter-venue">Майданчик</label>
                        <select id="filter-venue" name="venue">
                            <option value="">Усі майданчики</option>
                        </select>
                    </div>

                    <div class="filter-actions">
                        <button type="submit" class="buy-ticket-btn">Застосувати фільтри</button>
                        <button type="button" id="reset-filters-btn" class="reset-filter-btn">Скинути</button>
                        <a href="index.html" class="back-btn">← Усі події</a>
                    </div>
                </form>
            </section>

            <section class="results-section">
                <div class="results-header">
                    <h2 id="results-count">Підібрані події</h2>
                </div>
                <div id="filtered-events-container" class="events-grid">
                    <p>Завантаження подій...</p>
                </div>
            </section>
        </main>

        <footer class="site-footer">
            <p>&copy; 2026 Developed by Team Eventify</p>
        </footer>

        <script src="filter.js"></script>
        <script src="script.js"></script>
    </body>
</html>
