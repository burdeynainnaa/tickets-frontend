<!DOCTYPE html>
<html lang="uk">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Пошук подій — Eventify</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <header class="site-header">
            <div class="header-container">
                <a href="index.html" class="logo">🎉 Eventify</a>
                <nav class="nav-links">
                    <a href="search.html" class="nav-search-link active" aria-label="Пошук">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <circle cx="11" cy="11" r="8"></circle>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                        </svg>
                    </a>
                    <a href="filter.html">Підбір квитків</a>
                    <a href="artists.html">Артисти</a>
                    <a href="venues.html">Майданчики</a>
                    <a href="about.html">Про нас</a>
                    <span id="auth-nav" style="display: inline-flex; gap: 15px; margin-left: 10px;"></span>
                </nav>
            </div>
        </header>

        <main class="main-container">
            <section class="hero-section">
                <h1>Пошук подій</h1>
                <p>Швидкий пошук за назвою події або ім’ям артиста</p>
            </section>

            <section class="search-page-box">
                <div class="search-page-input-row">
                    <span class="search-page-icon" aria-hidden="true">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="11" cy="11" r="8"></circle>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                        </svg>
                    </span>
                    <input
                        type="text"
                        id="search-page-input"
                        class="search-page-input"
                        placeholder="Введіть сюди назву події чи артиста для пошуку..."
                        autocomplete="off"
                        autofocus
                    >
                    <button type="button" id="search-page-clear" class="search-page-clear" aria-label="Очистити">✕</button>
                </div>
            </section>

            <section class="results-section">
                <div class="results-header">
                    <h2 id="search-results-heading">Введіть назву події або артиста</h2>
                </div>
                <div id="search-results-list" class="search-results-column">
                    <p class="search-hint-text">Підходящі події з’являться тут окремим списком у міру введення тексту.</p>
                </div>
            </section>
        </main>

        <footer class="site-footer">
            <p>&copy; 2026 Developed by Viktoria Matiitso</p>
        </footer>

        <script src="search.js"></script>
        <script src="script.js"></script>
    </body>
</html>
